<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingXi Models — Swift 原生 AI 模型索引与规格库</title>
  <meta name="description" content="灵犀智能体原生大模型索引库，每日自动同步 models.dev，提供 Swift 原生调用代码、全量模型上下文与能力规格字典。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    code, pre { font-family: 'Fira Code', monospace; }
    .glass {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-zinc-800 glass">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🦊</span>
        <div>
          <span class="font-bold text-lg bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-amber-300">LingXi Models</span>
          <span class="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-800">Swift Edition</span>
        </div>
      </div>

      <div class="flex items-center space-x-3 text-sm">
        <a href="/models.json" target="_blank" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 transition-colors border border-zinc-700">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span class="font-mono text-xs">models.json</span>
        </a>
        <a href="https://github.com/LingXiFox/LingXiAgent" target="_blank" class="p-2 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 transition-colors border border-zinc-700">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <div class="border-b border-zinc-800/80 bg-gradient-to-b from-purple-950/20 via-zinc-950 to-zinc-950 py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
        为 <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300">Swift 智能体生态</span> 打造的模型索引
      </h1>
      <p class="mt-3 text-sm sm:text-base text-zinc-400 max-w-2xl mx-auto">
        每日自动同步并提纯开源元数据。无论在 macOS、iOS 还是 Linux，一行 Swift 代码即插即用，零配置调度全球大模型。
      </p>
      
      <!-- Stats Bar -->
      <div id="stats-bar" class="mt-6 flex items-center justify-center space-x-6 text-xs text-zinc-400">
        <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>已接入 <strong id="stat-providers" class="text-zinc-200 mx-1">-</strong> 家提供商</span>
        <span>•</span>
        <span>收录 <strong id="stat-models" class="text-zinc-200 mx-1">-</strong> 个模型</span>
        <span>•</span>
        <span>更新于 <span id="stat-updated" class="text-zinc-300">-</span></span>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- Controls: Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input 
          id="search-input" 
          type="text" 
          placeholder="搜索模型名称、ID、厂商 (例如: deepseek-r1, claude, opencode, glm)..." 
          class="w-full pl-10 pr-4 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm focus:outline-none focus:border-purple-500 text-zinc-200 placeholder-zinc-500 transition-colors"
        >
      </div>

      <!-- Capability Chips -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <button data-cap="all" class="cap-btn px-3 py-2 rounded-lg bg-purple-600 text-white font-medium whitespace-nowrap transition-colors">全部</button>
        <button data-cap="reasoning" class="cap-btn px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors">🧠 深度思考</button>
        <button data-cap="attachment" class="cap-btn px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors">👁 视觉多模态</button>
        <button data-cap="toolCall" class="cap-btn px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors">🛠 工具调用</button>
        <button data-cap="largeContext" class="cap-btn px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors">⚡️ ≥128k 窗口</button>
      </div>
    </div>

    <!-- Provider Pills Horizontal Scroll -->
    <div id="provider-pills" class="flex gap-2 overflow-x-auto pb-3 mb-6 custom-scrollbar text-xs">
      <button data-provider="all" class="prov-pill px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-200 border border-zinc-700 whitespace-nowrap">全部厂商</button>
    </div>

    <!-- Models Grid -->
    <div id="models-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full py-16 text-center text-zinc-500">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-zinc-700 border-t-purple-500 mb-3"></div>
        <p>正在读取模型数据...</p>
      </div>
    </div>

    <!-- Pagination / Result Count -->
    <div id="footer-count" class="mt-8 text-center text-xs text-zinc-500"></div>

  </main>

  <!-- Swift Code Modal -->
  <div id="code-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-zinc-800">
        <div>
          <h3 id="modal-title" class="text-base font-semibold text-zinc-100">Swift 调用代码</h3>
          <p id="modal-subtitle" class="text-xs text-zinc-400 font-mono mt-0.5"></p>
        </div>
        <button id="close-modal" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="mt-4 relative">
        <pre class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 text-xs text-zinc-300 font-mono overflow-x-auto custom-scrollbar max-h-96 leading-relaxed"><code id="modal-code"></code></pre>
        <button id="copy-btn" class="absolute top-3 right-3 px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium flex items-center space-x-1.5 shadow-lg transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          <span id="copy-text">复制代码</span>
        </button>
      </div>

      <div class="mt-4 flex items-center justify-between text-xs text-zinc-500">
        <span>基于灵犀统一模型规范 (LingXiAgent Core)</span>
        <button id="close-modal-bottom" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-zinc-300 transition-colors">完成</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-600">
    <p>© 2026 LingXiFox (灵犀狐). Powered by LingXiAgent & Open Models Ecosystem.</p>
  </footer>

  <script>
    let allModels = [];
    let currentFilterCap = 'all';
    let currentFilterProv = 'all';
    let searchQuery = '';

    const POPULAR_PROVIDERS = ['opencode', 'zai', 'alibaba-coding-plan', 'openai', 'anthropic', 'google', 'deepseek', 'cloudflare-ai-gateway', 'siliconflow-cn'];

    async function init() {
      try {
        const resp = await fetch('/summary.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        allModels = data.models || [];
        document.getElementById('stat-providers').textContent = data.totalProviders || '-';
        document.getElementById('stat-models').textContent = data.totalModels ? Number(data.totalModels).toLocaleString() : '-';
        document.getElementById('stat-updated').textContent = (data.updatedAt || '').split('T')[0] || 'Today';

        buildProviderPills();
        renderModels();
      } catch (err) {
        console.error('Failed to load summary.json', err);
        document.getElementById('models-list').innerHTML = `
          <div class="col-span-full py-16 text-center text-red-400">
            <p>加载数据失败: ${err.message}</p>
            <p class="text-xs text-zinc-500 mt-2">请检查 /summary.json 是否部署完成。</p>
          </div>
        `;
      }
    }

    function buildProviderPills() {
      const container = document.getElementById('provider-pills');
      const counts = {};
      allModels.forEach(m => {
        counts[m.providerId] = (counts[m.providerId] || 0) + 1;
      });

      // Sort popular first, then by count
      const sortedProviders = Object.keys(counts).sort((a, b) => {
        const aPop = POPULAR_PROVIDERS.indexOf(a);
        const bPop = POPULAR_PROVIDERS.indexOf(b);
        if (aPop !== -1 && bPop !== -1) return aPop - bPop;
        if (aPop !== -1) return -1;
        if (bPop !== -1) return 1;
        return counts[b] - counts[a];
      });

      let html = '<button data-provider="all" class="prov-pill px-3 py-1.5 rounded-full bg-purple-600 text-white font-medium whitespace-nowrap">全部厂商</button>';
      sortedProviders.slice(0, 30).forEach(pid => {
        const sample = allModels.find(m => m.providerId === pid);
        const name = sample ? sample.providerName : pid;
        html += `<button data-provider="${pid}" class="prov-pill px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors">${name} (${counts[pid]})</button>`;
      });
      container.innerHTML = html;

      container.querySelectorAll('.prov-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.prov-pill').forEach(b => {
            b.className = 'prov-pill px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors';
          });
          btn.className = 'prov-pill px-3 py-1.5 rounded-full bg-purple-600 text-white font-medium whitespace-nowrap';
          currentFilterProv = btn.dataset.provider;
          renderModels();
        });
      });
    }

    function filterModels() {
      const q = searchQuery.toLowerCase().trim();
      return allModels.filter(m => {
        if (currentFilterProv !== 'all' && m.providerId !== currentFilterProv) return false;

        if (currentFilterCap === 'reasoning' && !m.reasoning) return false;
        if (currentFilterCap === 'attachment' && !m.attachment) return false;
        if (currentFilterCap === 'toolCall' && !m.toolCall) return false;
        if (currentFilterCap === 'largeContext' && m.context < 128000) return false;

        if (q) {
          const matchName = (m.name || '').toLowerCase().includes(q);
          const matchId = (m.modelId || '').toLowerCase().includes(q);
          const matchProv = (m.providerName || '').toLowerCase().includes(q) || (m.providerId || '').toLowerCase().includes(q);
          if (!matchName && !matchId && !matchProv) return false;
        }

        return true;
      });
    }

    function formatNumber(n) {
      if (!n) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
      return n.toString();
    }

    function renderModels() {
      const filtered = filterModels();
      const container = document.getElementById('models-list');
      const footerCount = document.getElementById('footer-count');

      footerCount.textContent = `共展示 ${filtered.length.toLocaleString()} 个模型 (总计 ${allModels.length.toLocaleString()})`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-zinc-500">
            <svg class="w-10 h-10 mx-auto mb-2 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p>未找到符合条件的模型</p>
          </div>
        `;
        return;
      }

      // Render top 120 models for performance
      const slice = filtered.slice(0, 120);
      container.innerHTML = slice.map((m, idx) => {
        return `
          <div class="bg-zinc-900/90 border border-zinc-800/80 hover:border-purple-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all hover:shadow-xl hover:shadow-purple-950/20 group">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-zinc-800 text-zinc-300 font-medium border border-zinc-700/60">${escapeHtml(m.providerName)}</span>
                <span class="text-[11px] text-zinc-500 font-mono">${escapeHtml(m.swiftDriver || 'openaiChat')}</span>
              </div>
              <h3 class="font-bold text-base text-zinc-100 group-hover:text-purple-300 transition-colors line-clamp-1" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}</h3>
              <p class="text-xs text-zinc-400 font-mono mt-0.5 line-clamp-1">${escapeHtml(m.modelId)}</p>
              
              <div class="flex flex-wrap gap-1.5 mt-3 text-[11px]">
                ${m.context ? `<span class="px-2 py-0.5 rounded bg-zinc-800/80 text-zinc-300 border border-zinc-700/50">⚡️ ${formatNumber(m.context)} ctx</span>` : ''}
                ${m.reasoning ? `<span class="px-2 py-0.5 rounded bg-purple-950/60 text-purple-300 border border-purple-800/50">🧠 Reasoning</span>` : ''}
                ${m.attachment ? `<span class="px-2 py-0.5 rounded bg-blue-950/60 text-blue-300 border border-blue-800/50">👁 Vision</span>` : ''}
                ${m.toolCall ? `<span class="px-2 py-0.5 rounded bg-amber-950/60 text-amber-300 border border-amber-800/50">🛠 Tools</span>` : ''}
              </div>
            </div>

            <div class="mt-5 pt-4 border-t border-zinc-800/60 flex items-center justify-between text-xs">
              <div class="text-zinc-400 font-mono text-[11px]">
                ${m.costInput || m.costOutput ? `$${m.costInput || 0} / $${m.costOutput || 0} <span class="text-zinc-600">/1M</span>` : '<span class="text-zinc-600">-</span>'}
              </div>
              <button 
                onclick="showSwiftCode('${escapeAttr(m.providerId)}', '${escapeAttr(m.modelId)}', '${escapeAttr(m.name)}', '${escapeAttr(m.baseURL)}')" 
                class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-purple-600 hover:text-white text-zinc-300 font-medium transition-colors flex items-center space-x-1"
              >
                <span>Swift 调用</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    window.showSwiftCode = function(providerId, modelId, modelName, baseURL) {
      const modal = document.getElementById('code-modal');
      const title = document.getElementById('modal-title');
      const subtitle = document.getElementById('modal-subtitle');
      const code = document.getElementById('modal-code');

      title.textContent = `Swift 调用代码: ${modelName}`;
      subtitle.textContent = `${providerId}/${modelId} • ${baseURL || 'OpenAI Compatible'}`;

      const envVar = providerId.toUpperCase().replace(/[^A-Z0-9]/g, '_') + '_API_KEY';
      const snippet = `import LingXiAgent

// 1. One-line inference via LingXiAgent Registry
let model = LingXiAgent.model("${providerId}/${modelId}", apiKey: processEnvironment["${envVar}"])

// 2. Or initialize via OpenAI-Compatible factory
let provider = LingXiProvider.openAICompatible(
    baseURL: URL(string: "${baseURL || 'https://api.lingxifox.cn/v1'}")!,
    apiKey: processEnvironment["${envVar}"]
)
let session = provider.model("${modelId}")

// 3. Stream responses with reasoning support
for try await chunk in session.stream("Hello, LingXi!") {
    if let reasoning = chunk.reasoning {
        print("[Thinking] \\(reasoning)", terminator: "")
    }
    print(chunk.text, terminator: "")
}`;

      code.textContent = snippet;
      modal.classList.remove('hidden');
    };

    // Modal Events
    const closeModal = () => document.getElementById('code-modal').classList.add('hidden');
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('close-modal-bottom').addEventListener('click', closeModal);
    document.getElementById('code-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('code-modal')) closeModal();
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const text = document.getElementById('modal-code').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const textSpan = document.getElementById('copy-text');
        textSpan.textContent = '已复制！';
        setTimeout(() => textSpan.textContent = '复制代码', 2000);
      });
    });

    // Search input
    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchQuery = e.target.value;
        renderModels();
      }, 150);
    });

    // Capability filters
    document.querySelectorAll('.cap-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cap-btn').forEach(b => {
          b.className = 'cap-btn px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white whitespace-nowrap transition-colors';
        });
        btn.className = 'cap-btn px-3 py-2 rounded-lg bg-purple-600 text-white font-medium whitespace-nowrap transition-colors';
        currentFilterCap = btn.dataset.cap;
        renderModels();
      });
    });

    init();
  </script>
</body>
</html>
