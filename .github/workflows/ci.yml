name: CI Matrix Gate

on:
  push:
    branches: [ main, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS Build & Test (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Print Swift Version
        run: swift --version

      - name: Build All Targets
        run: swift build -v

      - name: Run Test Suite
        run: swift test -v --parallel

      - name: Smoke Test CLI Executables
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent" --help || true

  test-linux:
    name: Linux Build & Test (x86_64)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y libsqlite3-dev pkg-config

      - name: Print Swift Version
        run: swift --version

      - name: Build All Targets
        run: |
          swift build -v --product lingxiagent
          swift build -v --product LingXiCoreHost
          swift build -v --product LingXiTUI

      - name: Run Test Suite
        run: swift test -v --parallel

      - name: Smoke Test CLI Executables
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent" --help || true

  test-windows:
    name: Windows Build & Test (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.0-release
          tag: 6.0-RELEASE

      - name: Provision SQLite Native Dependencies
        shell: cmd
        run: |
          vcpkg install sqlite3:x64-windows
          vcpkg integrate install
          echo INCLUDE=C:\vcpkg\installed\x64-windows\include;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=C:\vcpkg\installed\x64-windows\lib;%LIB%>> %GITHUB_ENV%
          echo PATH=C:\vcpkg\installed\x64-windows\bin;%PATH%>> %GITHUB_ENV%

      - name: Print Swift Version
        run: swift --version

      - name: Build All Targets
        shell: bash
        run: |
          swift build -v --product lingxiagent
          swift build -v --product LingXiCoreHost
          swift build -v --product LingXiTUI

      - name: Run Test Suite
        shell: bash
        run: swift test -v

      - name: Smoke Test CLI Executables
        shell: bash
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent.exe" --help || true
