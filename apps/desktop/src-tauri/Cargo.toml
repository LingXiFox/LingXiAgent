[package]
name = "lingxi-desktop"
description = "LingXiAgent desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "lingxi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Automation-only WebDriver bridge. Never enabled for release builds.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
lingxi-spec = { workspace = true }
lingxi-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
uuid = { workspace = true }
base64 = "0.23.1"
infer = "0.22.0"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-dialog = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
