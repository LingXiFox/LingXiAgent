name: CI Matrix Gate

"on":
  push:
    branches: [ main, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  LINGXI_NON_INTERACTIVE: "1"

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS：主 gate
  # ─────────────────────────────────────────────────────────────
  test-macos:
    name: macOS Build & Test (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated test environment
        run: |
          TEST_HOME="${{ runner.temp }}/test-home"
          mkdir -p "$TEST_HOME"
          echo "HOME=$TEST_HOME" >> "$GITHUB_ENV"
          echo "LINGXI_DATA_DIR=$TEST_HOME/.lingxiagent" >> "$GITHUB_ENV"
          echo "LINGXI_DISABLE_PLUGINS=1" >> "$GITHUB_ENV"

      - name: Select Xcode & print versions
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          swift --version
          xcodebuild -version

      - name: Provide ripgrep for the search tools
        run: |
          # grep and glob shell out to `rg`; without it the tools fail closed and every
          # search-backed test errors. Resolve-or-install keeps the step cheap when present.
          command -v rg > /dev/null 2>&1 && exit 0
          brew install ripgrep

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-

      - name: Stage 1 - Build products + tests (single pass)
        timeout-minutes: 15
        run: swift build --build-tests

      - name: Stage 2 - Architecture Boundary & Platform Gate
        timeout-minutes: 5
        run: |
          swift test --skip-build --filter PlatformBoundaryArchitectureTests < /dev/null
          swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null
          swift test --skip-build --filter PlatformBuildGateTests < /dev/null

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        timeout-minutes: 5
        run: swift test --skip-build --filter PlatformCryptoKATTests < /dev/null

      - name: Stage 4 - IPC & Process Robustness Gate
        timeout-minutes: 5
        run: swift test --skip-build --filter IPCPeerRobustnessTests < /dev/null

      - name: Stage 5 - Controlled Full Integration Test Suite
        timeout-minutes: 28
        run: bash Scripts/ci-integration-tests.sh

      - name: Stage 6 - Smoke test CLI executables
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          echo "::group::lingxiagent --help"
          "$BIN_PATH/lingxiagent"     --help      < /dev/null
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          "$BIN_PATH/LingXiCoreHost"  auth list   < /dev/null
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          "$BIN_PATH/lingxiagent"     --smoke     < /dev/null
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: test-results.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Linux：主 gate
  # ─────────────────────────────────────────────────────────────
  test-linux:
    name: Linux Build & Test (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swift:6.0.3
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies & setup test user
        timeout-minutes: 8
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config python3 bubblewrap nodejs ripgrep
          useradd -m -u 1001 -s /bin/bash testuser || true
          swift --version

      - name: Prepare isolated test environment
        run: |
          mkdir -p /tmp/test-home /tmp/test-home/.lingxiagent
          chown -R testuser:testuser /tmp/test-home
          git config --global --add safe.directory '*'
          echo "HOME=/tmp/test-home" >> "$GITHUB_ENV"
          echo "LINGXI_DATA_DIR=/tmp/test-home/.lingxiagent" >> "$GITHUB_ENV"
          echo "LINGXI_DISABLE_PLUGINS=1" >> "$GITHUB_ENV"

      - name: Probe bubblewrap availability
        run: |
          if bwrap --dev-bind / / true 2>/dev/null; then
            echo "LINGXI_SANDBOX_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::bubblewrap unavailable in this container; sandbox tests will be skipped"
            echo "LINGXI_SANDBOX_AVAILABLE=0" >> "$GITHUB_ENV"
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-

      - name: Setup workspace ownership for testuser
        run: |
          chown -R testuser:testuser .
          su -s /bin/bash -m testuser -c "git config --global --add safe.directory '*'"

      - name: Stage 1 - Build products + tests (single pass)
        timeout-minutes: 15
        run: su -s /bin/bash -m testuser -c "swift build --build-tests"

      - name: Stage 2 - Architecture Boundary & Platform Gate
        timeout-minutes: 5
        run: |
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformBoundaryArchitectureTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformBuildGateTests < /dev/null"

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        timeout-minutes: 5
        run: su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformCryptoKATTests < /dev/null"

      - name: Stage 4 - IPC & Process Robustness Gate
        timeout-minutes: 5
        run: su -s /bin/bash -m testuser -c "swift test --skip-build --filter IPCPeerRobustnessTests < /dev/null"

      - name: Stage 5 - Controlled Full Integration Test Suite
        timeout-minutes: 28
        run: |
          # Mirrors the macOS gate: bounded chunks with a per-chunk watchdog, so a deadlocked
          # group reports itself instead of hanging the whole step for 18 minutes.
          su -s /bin/bash -m testuser -c "LINGXI_CI_XUNIT_DIR='$PWD/test-results' bash Scripts/ci-integration-tests.sh < /dev/null"

      - name: Stage 6 - Smoke test CLI executables
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(su -s /bin/bash -m testuser -c 'swift build --show-bin-path')"
          echo "::group::lingxiagent --help"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/lingxiagent'     --help      < /dev/null"
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/LingXiCoreHost'  auth list   < /dev/null"
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/lingxiagent'     --smoke     < /dev/null"
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Windows：正式发布平台，与 macOS / Linux 同等门禁
  # ─────────────────────────────────────────────────────────────
  test-windows:
    name: Windows Build & Test (x86_64)
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          update-sdk-modules: true

      - name: Provision SQLite Native Dependencies
        shell: cmd
        run: |
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install sqlite3:x64-windows
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" integrate install
          echo INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib;%LIB%>> %GITHUB_ENV%
          echo PATH=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%VCPKG_INSTALLATION_ROOT%;%PATH%>> %GITHUB_ENV%

      - uses: actions/checkout@v4

      - name: Diagnose environment
        shell: pwsh
        run: |
          "LINGXI_DISABLE_PLUGINS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          swift --version
          Get-Command swift, link, cl -ErrorAction SilentlyContinue | Format-Table Name, Source

      - name: Provide ripgrep for the search tools
        shell: bash
        timeout-minutes: 5
        run: |
          # Same reason as the macOS/Linux jobs: grep and glob shell out to `rg` and fail
          # closed without it. Chocolatey is on the runner image and its shim directory is
          # already on PATH, so the resolver finds rg.exe there.
          command -v rg > /dev/null 2>&1 && exit 0
          choco install ripgrep -y --no-progress
          if ! command -v rg > /dev/null 2>&1; then
            echo "::error::ripgrep is not resolvable after installation"
            exit 1
          fi
          rg --version | head -1

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-windows-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-windows-

      - name: Stage 1 - Build products + tests (single pass)
        shell: bash
        timeout-minutes: 25
        run: swift build --build-tests

      - name: Stage 2 - Architecture Boundary & Platform Gate
        shell: bash
        timeout-minutes: 5
        run: |
          swift test --skip-build --filter PlatformBoundaryArchitectureTests < /dev/null
          swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null
          swift test --skip-build --filter PlatformBuildGateTests < /dev/null

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        shell: bash
        timeout-minutes: 5
        run: swift test --skip-build --filter PlatformCryptoKATTests < /dev/null

      - name: Stage 4 - IPC & Process Robustness Gate
        shell: bash
        timeout-minutes: 5
        run: swift test --skip-build --filter IPCPeerRobustnessTests < /dev/null

      - name: Stage 5 - Controlled Full Integration Test Suite
        shell: bash
        timeout-minutes: 60
        run: bash Scripts/ci-integration-tests.sh

      - name: Stage 6 - Smoke test CLI executables
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/sqlite3.dll" "$BIN_PATH/"
          test -f "$BIN_PATH/sqlite3.dll"
          echo "::group::lingxiagent --help"
          "$BIN_PATH/lingxiagent.exe"    --help     < /dev/null
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          "$BIN_PATH/LingXiCoreHost.exe" auth list  < /dev/null
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          "$BIN_PATH/lingxiagent.exe"    --smoke    < /dev/null
          echo "::endgroup::"

  # ─────────────────────────────────────────────────────────────
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test-macos, test-linux, test-windows]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.test-linux.result }}" != "success" ] || \
             [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "::error::macOS, Linux or Windows gate failed"
            exit 1
          fi
          echo "Gate passed."
