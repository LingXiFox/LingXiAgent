[workspace]
resolver = "2"
members = [
  "crates/lingxi-spec",
  "crates/lingxi-runtime",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
lingxi-spec = { path = "crates/lingxi-spec" }
lingxi-runtime = { path = "crates/lingxi-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
