# LingXi Caddy hardening/override drop-in
#
# Install with:
#   sudo install -d -m 0755 /etc/systemd/system/caddy.service.d
#   sudo install -m 0644 caddy.service.d-override.conf \
#        /etc/systemd/system/caddy.service.d/override.conf
#   sudo systemctl daemon-reload
#
# Why a drop-in rather than editing /usr/lib/systemd/system/caddy.service:
# the packaged unit is replaced on every Caddy upgrade, so a drop-in is the only
# place these settings survive.
[Service]
# The admin socket lives here. RuntimeDirectory creates /run/caddy owned by the
# service user on every start, so the socket can be created with mode 0600 and
# no other local user can reach the admin API.
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750

# Reset the packaged ExecReload, which omits --address and therefore tries to
# reach the admin API on the default localhost:2019 — a port this configuration
# deliberately does not open. Without this line every `systemctl reload caddy`
# fails and operators are pushed back to restarting the process.
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --address unix//run/caddy/admin.sock
