name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.0)'
        required: false
        default: 'vNext'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          if [ -d "$BIN_PATH/LingXiAgent_LingXiCore.bundle" ]; then
            cp -R "$BIN_PATH/LingXiAgent_LingXiCore.bundle" staging/
          fi
          mkdir -p staging/Sidecars/browser-host
          if [ -d "Sidecars/browser-host" ]; then
            cp -f Sidecars/browser-host/index.mjs staging/Sidecars/browser-host/
            cp -f Sidecars/browser-host/package.json staging/Sidecars/browser-host/
          fi
          tar -czf "dist/lingxiagent-macos-arm64.tar.gz" -C staging .
          shasum -a 256 "dist/lingxiagent-macos-arm64.tar.gz" > "dist/lingxiagent-macos-arm64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y libsqlite3-dev pkg-config

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          swift build -c release --product LingXiTUI
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          if [ -f "$BIN_PATH/LingXiTUI" ]; then
            cp -f "$BIN_PATH/LingXiTUI" staging/
          fi
          for b in "$BIN_PATH"/*LingXiCore*.bundle "$BIN_PATH"/*LingXiCore*.resources; do
            if [ -d "$b" ]; then
              cp -R "$b" staging/
            fi
          done
          mkdir -p staging/Sidecars/browser-host
          if [ -d "Sidecars/browser-host" ]; then
            cp -f Sidecars/browser-host/index.mjs staging/Sidecars/browser-host/
            cp -f Sidecars/browser-host/package.json staging/Sidecars/browser-host/
          fi
          tar -czf "dist/lingxiagent-linux-x86_64.tar.gz" -C staging .
          sha256sum "dist/lingxiagent-linux-x86_64.tar.gz" > "dist/lingxiagent-linux-x86_64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.0-release
          tag: 6.0-RELEASE

      - name: Provision SQLite Native Dependencies
        shell: cmd
        run: |
          vcpkg install sqlite3:x64-windows
          vcpkg integrate install
          echo INCLUDE=C:\vcpkg\installed\x64-windows\include;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=C:\vcpkg\installed\x64-windows\lib;%LIB%>> %GITHUB_ENV%
          echo PATH=C:\vcpkg\installed\x64-windows\bin;%PATH%>> %GITHUB_ENV%

      - name: Build Release Binaries
        shell: bash
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          swift build -c release --product LingXiTUI
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent.exe" staging/
          if [ -f "$BIN_PATH/LingXiCoreHost.exe" ]; then
            cp -f "$BIN_PATH/LingXiCoreHost.exe" staging/
          fi
          if [ -f "$BIN_PATH/LingXiTUI.exe" ]; then
            cp -f "$BIN_PATH/LingXiTUI.exe" staging/
          fi
          for b in "$BIN_PATH"/*LingXiCore*.bundle "$BIN_PATH"/*LingXiCore*.resources; do
            if [ -d "$b" ]; then
              cp -R "$b" staging/
            fi
          done
          mkdir -p staging/Sidecars/browser-host
          if [ -d "Sidecars/browser-host" ]; then
            cp -f Sidecars/browser-host/index.mjs staging/Sidecars/browser-host/
            cp -f Sidecars/browser-host/package.json staging/Sidecars/browser-host/
          fi
          cd staging && 7z a "../dist/lingxiagent-windows-x86_64.zip" * && cd ..
          certutil -hashfile "dist/lingxiagent-windows-x86_64.zip" SHA256 > "dist/lingxiagent-windows-x86_64.zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*

  publish-release:
    needs: [build-macos, build-linux, build-windows]
    if: needs.build-macos.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
