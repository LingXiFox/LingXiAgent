name: CI Matrix Gate

"on":
  push:
    branches: [ main, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      stress_rounds:
        description: 'Linux only: consecutive stress rounds for the stdio/pipe family (0 = off)'
        required: false
        default: '0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  LINGXI_NON_INTERACTIVE: "1"

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS：主 gate
  # ─────────────────────────────────────────────────────────────
  test-macos:
    name: macOS Build & Test (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated test environment
        run: |
          TEST_HOME="${{ runner.temp }}/test-home"
          mkdir -p "$TEST_HOME"
          echo "HOME=$TEST_HOME" >> "$GITHUB_ENV"
          echo "LINGXI_DATA_DIR=$TEST_HOME/.lingxiagent" >> "$GITHUB_ENV"
          echo "LINGXI_DISABLE_PLUGINS=1" >> "$GITHUB_ENV"

      - name: Select Xcode & print versions
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          swift --version
          xcodebuild -version

      - name: Provide ripgrep for the search tools
        run: |
          # grep and glob shell out to `rg`; without it the tools fail closed and every
          # search-backed test errors. Resolve-or-install keeps the step cheap when present.
          command -v rg > /dev/null 2>&1 && exit 0
          brew install ripgrep

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-

      - name: Stage 1 - Build products + tests (single pass)
        timeout-minutes: 15
        run: swift build --build-tests

      - name: Stage 2 - Architecture Boundary & Platform Gate
        timeout-minutes: 5
        run: |
          swift test --skip-build --filter LingXiPlatformContractTests < /dev/null
          swift test --skip-build --filter LingXiWireContractTests < /dev/null
          swift test --skip-build --filter LingXiCapabilityContractTests < /dev/null
          swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null
          swift test --skip-build --filter PlatformBuildGateTests < /dev/null

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        timeout-minutes: 5
        run: swift test --skip-build --filter PlatformCryptoKATTests < /dev/null

      - name: Stage 4 - IPC & Process Robustness Gate
        timeout-minutes: 5
        run: |
          swift test --skip-build --filter IPCPeerRobustnessTests < /dev/null
          swift test --skip-build --filter LingXiIPCRobustnessContractTests < /dev/null

      - name: Stage 5 - Controlled Full Integration Test Suite
        timeout-minutes: 35
        run: LINGXI_CI_XUNIT_DIR="$PWD/test-results" bash Scripts/ci-integration-tests.sh

      - name: Stage 6 - Smoke test CLI executables
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          echo "::group::lingxiagent --help"
          "$BIN_PATH/lingxiagent"     --help      < /dev/null
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          "$BIN_PATH/LingXiCoreHost"  auth list   < /dev/null
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          "$BIN_PATH/lingxiagent"     --smoke     < /dev/null
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: test-results-artifact/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Linux：主 gate
  # ─────────────────────────────────────────────────────────────
  test-linux:
    name: Linux Build & Test (x86_64)
    runs-on: ubuntu-latest
    # The stress rounds run after the normal Stage 5, so a dispatched run needs the room for both;
    # 45 minutes is sized for a gate pass, and clipping the tail would report a stress round as a
    # job timeout rather than as whatever it actually found.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 80 || 45 }}
    container:
      image: swift:6.0.3
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies & setup test user
        timeout-minutes: 8
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config python3 bubblewrap nodejs ripgrep
          useradd -m -u 1001 -s /bin/bash testuser || true
          swift --version

      - name: Prepare isolated test environment
        run: |
          mkdir -p /tmp/test-home /tmp/test-home/.lingxiagent
          chown -R testuser:testuser /tmp/test-home
          git config --global --add safe.directory '*'
          echo "HOME=/tmp/test-home" >> "$GITHUB_ENV"
          echo "LINGXI_DATA_DIR=/tmp/test-home/.lingxiagent" >> "$GITHUB_ENV"
          echo "LINGXI_DISABLE_PLUGINS=1" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu 24.04+ confines unprivileged user namespaces behind an AppArmor sysctl, and
          # bubblewrap needs one to get the capabilities it uses to bring up the sandbox's
          # loopback interface. This container is privileged, so the knob is writable here.
          # Without it the workspace profile cannot run any command on the Linux gate.
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # yama confines ptrace to direct children, which makes /proc/<pid>/task/*/syscall
          # unreadable from the harness -- the test binary is a grandchild through the SwiftPM
          # driver, so the per-thread readiness census came back "unreadable" on every thread.
          # This is an ephemeral runner container that already runs privileged, and without it the
          # wedged-chunk diagnostics cannot name the descriptor a reader is parked on.
          sysctl -w kernel.yama.ptrace_scope=0 2>/dev/null || true

      - name: Probe bubblewrap availability
        run: |
          # Informational only: LinuxSandboxAdapter now probes usability itself, under the same
          # identity that runs the tests. Probing as root used to report a sandbox that testuser
          # could not actually create, because the netns loopback setup needs caps the user lacks.
          su -s /bin/bash -m testuser -c 'bwrap --proc /proc --dev /dev --tmpfs /tmp --unshare-net --ro-bind /usr /usr --ro-bind /bin /bin -- true' \
            && echo "bubblewrap usable by testuser; sandbox-backed shell tests will run" \
            || echo "::warning::bubblewrap unusable by testuser; shell tools fall back to unsandboxed execution"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-

      - name: Setup workspace ownership for testuser
        run: |
          # $HOME has to be chowned here too, not just the workspace: HOME was pointed at
          # /tmp/test-home before the restore, so `~/.cache/...` in the cache path list is restored
          # *as root* and creates root-owned directories under the HOME that testuser then builds in.
          # clang's module cache (which lives under $HOME/.cache) then fails with
          # "unable to open output file '.../SwiftShims.pcm': Permission denied" -- but only on a
          # cache hit, which is why the misses looked fine.
          chown -R testuser:testuser . "$HOME"
          su -s /bin/bash -m testuser -c "git config --global --add safe.directory '*'"

      - name: Stage 1 - Build products + tests (single pass)
        timeout-minutes: 15
        run: su -s /bin/bash -m testuser -c "swift build --build-tests"

      - name: Stage 2 - Architecture Boundary & Platform Gate
        timeout-minutes: 5
        run: |
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter LingXiPlatformContractTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter LingXiWireContractTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter LingXiCapabilityContractTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformBuildGateTests < /dev/null"

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        timeout-minutes: 5
        run: su -s /bin/bash -m testuser -c "swift test --skip-build --filter PlatformCryptoKATTests < /dev/null"

      - name: Stage 4 - IPC & Process Robustness Gate
        timeout-minutes: 5
        run: |
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter IPCPeerRobustnessTests < /dev/null"
          su -s /bin/bash -m testuser -c "swift test --skip-build --filter LingXiIPCRobustnessContractTests < /dev/null"

      - name: Stage 5 - Controlled Full Integration Test Suite
        timeout-minutes: 60
        run: |
          # Mirrors the macOS gate: bounded chunks with a per-chunk watchdog, so a deadlocked
          # group reports itself instead of hanging the whole step for 18 minutes. The budget is
          # wider than the default because the event stream showed a chunk that was slow rather
          # than stuck -- cases waiting on outbound TCP retries in a networkless container burn
          # ~140s and then finish -- and killing that loses results that were going to be
          # reported. The egress itself is the defect being tracked, not the budget.
          su -s /bin/bash -m testuser -c "LINGXI_CI_XUNIT_DIR='$PWD/test-results' LINGXI_CI_CHUNK_TIMEOUT=300 LINGXI_CI_STRESS_ROUNDS='${{ github.event.inputs.stress_rounds || '0' }}' bash Scripts/ci-integration-tests.sh < /dev/null"

      - name: Stage 6 - Smoke test CLI executables
        # An inline `run:` inside the Linux container defaults to `sh`, which rejects
        # `set -o pipefail` and fails the step before the smoke test ever launches.
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(su -s /bin/bash -m testuser -c 'swift build --show-bin-path')"
          echo "::group::lingxiagent --help"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/lingxiagent'     --help      < /dev/null"
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/LingXiCoreHost'  auth list   < /dev/null"
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          su -s /bin/bash -m testuser -c "'$BIN_PATH/lingxiagent'     --smoke     < /dev/null"
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results-artifact/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Windows：正式发布平台，与 macOS / Linux 同等门禁
  # ─────────────────────────────────────────────────────────────
  # Experimental only. Windows is not a supported platform for V1.0.0 and is not a release
  # blocker; formal support is deferred to V1.1.0 together with a dedicated runtime, pipe and
  # process-lifetime review. What stays here is the one thing worth knowing on every commit: that
  # the package still compiles, links and boots on x86_64-windows. Nothing in this job can fail the
  # gate -- the full integration suite, the crash forensics and the per-chunk watchdogs were
  # Windows-specific cost with no V1.0.0 decision hanging on them.
  test-windows:
    name: Windows Compile Check (informational)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          update-sdk-modules: true

      - name: Provision SQLite Native Dependencies
        shell: cmd
        run: |
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install sqlite3:x64-windows
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" integrate install
          echo INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib;%LIB%>> %GITHUB_ENV%
          echo %VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin>> %GITHUB_PATH%
          echo %VCPKG_INSTALLATION_ROOT%>> %GITHUB_PATH%
          echo C:\Program Files\Git\bin>> %GITHUB_PATH%
          echo C:\Program Files\Git\usr\bin>> %GITHUB_PATH%

      - uses: actions/checkout@v4

      - name: Diagnose environment
        shell: pwsh
        run: |
          "LINGXI_DISABLE_PLUGINS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          swift --version
          Get-Command swift, link, cl -ErrorAction SilentlyContinue | Format-Table Name, Source

      - name: Provide ripgrep for the search tools
        shell: bash
        timeout-minutes: 5
        run: |
          # Same reason as the macOS/Linux jobs: grep and glob shell out to `rg` and fail
          # closed without it. Chocolatey is on the runner image and its shim directory is
          # already on PATH, so the resolver finds rg.exe there.
          command -v rg > /dev/null 2>&1 && exit 0
          choco install ripgrep -y --no-progress
          if ! command -v rg > /dev/null 2>&1; then
            echo "::error::ripgrep is not resolvable after installation"
            exit 1
          fi
          rg --version | head -1

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-windows-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-windows-

      - name: Configure WER Crash Dumps
        shell: powershell
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "D:\a\_temp\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 8 -PropertyType DWord -Force | Out-Null
          mkdir -Force D:\a\_temp\dumps | Out-Null

      - name: Stage 1 - Build products + tests (single pass)
        shell: bash
        timeout-minutes: 25
        run: swift build --build-tests

      - name: Stage 2 - Architecture Boundary & Platform Gate
        shell: bash
        timeout-minutes: 5
        run: |
          swift test --skip-build --filter LingXiPlatformContractTests < /dev/null
          swift test --skip-build --filter LingXiWireContractTests < /dev/null
          swift test --skip-build --filter LingXiCapabilityContractTests < /dev/null
          swift test --skip-build --filter PlatformAbstractionAndDecouplingTests < /dev/null
          swift test --skip-build --filter PlatformBuildGateTests < /dev/null

      - name: Stage 6 - Smoke test CLI executables
        # Runs even when the compile gate above failed: the two verdicts are independent, and this
        # one is the only evidence that the linked executables still start.
        if: always() && !cancelled()
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/sqlite3.dll" "$BIN_PATH/"
          test -f "$BIN_PATH/sqlite3.dll"
          echo "::group::lingxiagent --help"
          "$BIN_PATH/lingxiagent.exe"    --help     < /dev/null
          echo "::endgroup::"
          echo "::group::LingXiCoreHost auth list"
          "$BIN_PATH/LingXiCoreHost.exe" auth list  < /dev/null
          echo "::endgroup::"
          echo "::group::lingxiagent --smoke"
          "$BIN_PATH/lingxiagent.exe"    --smoke    < /dev/null
          echo "::endgroup::"

  # ─────────────────────────────────────────────────────────────
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test-macos, test-linux]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          # V1.0.0 supports macOS and Linux. Windows is not in `needs` at all, so it cannot hold a
          # release; its outcome is reported for the V1.1.0 record only.
          if [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.test-linux.result }}" != "success" ]; then
            echo "::error::macOS or Linux gate failed"
            exit 1
          fi
          echo "V1.0.0 gate passed (macOS, Linux)."
