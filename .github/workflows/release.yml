name: Release LingXiAgent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Binaries
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build macOS Apple Silicon (arm64)
        run: |
          swift build -c release --product lingxiagent --arch arm64
          ARM64_BIN="$(swift build -c release --arch arm64 --show-bin-path)/lingxiagent"
          mkdir -p dist/arm64
          cp "$ARM64_BIN" dist/arm64/lingxiagent
          chmod +x dist/arm64/lingxiagent
          tar -czvf lingxiagent-macos-arm64.tar.gz -C dist/arm64 lingxiagent

      - name: Build macOS Intel (x86_64)
        run: |
          swift build -c release --product lingxiagent --arch x86_64
          X86_BIN="$(swift build -c release --arch x86_64 --show-bin-path)/lingxiagent"
          mkdir -p dist/x86_64
          cp "$X86_BIN" dist/x86_64/lingxiagent
          chmod +x dist/x86_64/lingxiagent
          tar -czvf lingxiagent-macos-x86_64.tar.gz -C dist/x86_64 lingxiagent

      - name: Build macOS Universal (arm64 + x86_64)
        run: |
          swift build -c release --product lingxiagent --arch arm64 --arch x86_64
          UNIVERSAL_BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/lingxiagent"
          mkdir -p dist/universal
          cp "$UNIVERSAL_BIN" dist/universal/lingxiagent
          chmod +x dist/universal/lingxiagent
          tar -czvf lingxiagent-macos-universal.tar.gz -C dist/universal lingxiagent

      - name: Generate Checksums
        run: |
          shasum -a 256 lingxiagent-macos-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            lingxiagent-macos-arm64.tar.gz
            lingxiagent-macos-x86_64.tar.gz
            lingxiagent-macos-universal.tar.gz
            checksums.txt
          generate_release_notes: true

