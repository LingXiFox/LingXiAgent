name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.0)'
        required: false
        default: 'vNext'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          if [ -d "$BIN_PATH/LingXiAgent_LingXiCore.bundle" ]; then
            cp -R "$BIN_PATH/LingXiAgent_LingXiCore.bundle" staging/
          fi
          tar -czf "dist/lingxiagent-macos-arm64.tar.gz" -C staging .
          shasum -a 256 "dist/lingxiagent-macos-arm64.tar.gz" > "dist/lingxiagent-macos-arm64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y libsqlite3-dev

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          if [ -d "$BIN_PATH/LingXiAgent_LingXiCore.bundle" ]; then
            cp -R "$BIN_PATH/LingXiAgent_LingXiCore.bundle" staging/
          fi
          tar -czf "dist/lingxiagent-linux-x86_64.tar.gz" -C staging .
          sha256sum "dist/lingxiagent-linux-x86_64.tar.gz" > "dist/lingxiagent-linux-x86_64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.0-release
          tag: 6.0-RELEASE

      - name: Build Release Binaries
        shell: bash
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent.exe" staging/
          if [ -f "$BIN_PATH/LingXiCoreHost.exe" ]; then
            cp -f "$BIN_PATH/LingXiCoreHost.exe" staging/
          fi
          cd staging && 7z a "../dist/lingxiagent-windows-x86_64.zip" * && cd ..
          certutil -hashfile "dist/lingxiagent-windows-x86_64.zip" SHA256 > "dist/lingxiagent-windows-x86_64.zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*

  publish-release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
