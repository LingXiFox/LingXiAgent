name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.0)'
        required: false
        default: 'vNext'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          swift build -c release --product LingXiTUI
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          # The TUI is one of the three declared user entry points, and the Linux package has always
          # shipped it; the macOS one did not, so the two platforms delivered different products.
          if [ -f "$BIN_PATH/LingXiTUI" ]; then
            cp -f "$BIN_PATH/LingXiTUI" staging/
          fi
          if [ -d "$BIN_PATH/LingXiAgent_LingXiCore.bundle" ]; then
            cp -R "$BIN_PATH/LingXiAgent_LingXiCore.bundle" staging/
          fi
          mkdir -p staging/Sidecars/browser-host
          if [ -d "Sidecars/browser-host" ]; then
            cp -f Sidecars/browser-host/index.mjs staging/Sidecars/browser-host/
            cp -f Sidecars/browser-host/package.json staging/Sidecars/browser-host/
          fi
          tar -czf "dist/lingxiagent-macos-arm64.tar.gz" -C staging .
          shasum -a 256 "dist/lingxiagent-macos-arm64.tar.gz" > "dist/lingxiagent-macos-arm64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y libsqlite3-dev pkg-config python3 bubblewrap

      - name: Build Release Binaries
        run: |
          swift build -c release --product lingxiagent
          swift build -c release --product LingXiCoreHost
          swift build -c release --product LingXiTUI
          BIN_PATH="$(swift build -c release --show-bin-path)"
          mkdir -p dist staging
          cp -f "$BIN_PATH/lingxiagent" staging/
          cp -f "$BIN_PATH/LingXiCoreHost" staging/
          if [ -f "$BIN_PATH/LingXiTUI" ]; then
            cp -f "$BIN_PATH/LingXiTUI" staging/
          fi
          for b in "$BIN_PATH"/*LingXiCore*.bundle "$BIN_PATH"/*LingXiCore*.resources; do
            if [ -d "$b" ]; then
              cp -R "$b" staging/
            fi
          done
          mkdir -p staging/Sidecars/browser-host
          if [ -d "Sidecars/browser-host" ]; then
            cp -f Sidecars/browser-host/index.mjs staging/Sidecars/browser-host/
            cp -f Sidecars/browser-host/package.json staging/Sidecars/browser-host/
          fi
          tar -czf "dist/lingxiagent-linux-x86_64.tar.gz" -C staging .
          sha256sum "dist/lingxiagent-linux-x86_64.tar.gz" > "dist/lingxiagent-linux-x86_64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  publish-release:
    # V1.0.0 ships macOS and Linux. The Windows build job that used to sit here -- vcpkg sqlite,
    # release build, zip and sha256 -- is a V1.1.0 item along with formal Windows support, so no
    # Windows asset is published and Windows cannot hold a release. The job text is recoverable from
    # git history; the platform implementation itself is untouched.
    needs: [build-macos, build-linux]
    if: needs.build-macos.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 平台支持 / Platform support

            | 平台 | 支持级别 |
            | :--- | :--- |
            | macOS (arm64, Apple Silicon / Intel) | Supported |
            | Linux (x86_64, Ubuntu / Debian / Arch / RHEL) | Supported |
            | Windows 10/11, Server 2022 (x86_64 / ARM64) | Experimental — 正式支持计划 V1.1.0 |

            Windows 不在本版本的支持范围内：不发布 Windows 预编译包，发布门禁也不看 Windows。
            源码与 `LingXiPlatform` 的 Windows 适配全部保留，可从源码构建试用，但不保证可用；
            运行时、pipe 与进程生命周期的 Windows 专项收敛在 V1.1.0 完成。
