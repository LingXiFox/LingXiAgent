name: CI Matrix Gate

on:
  push:
    branches: [ main, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS Build & Test (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi

      - name: Print Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Stage 1 - Build All Executable Products
        run: |
          swift build -v --product lingxiagent
          swift build -v --product LingXiCoreHost
          swift build -v --product LingXiTUI

      - name: Stage 2 - Architecture Boundary & Platform Gate
        run: |
          swift test --filter PlatformBoundaryArchitectureTests
          swift test --filter PlatformBuildGateTests

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        run: swift test --filter PlatformCryptoKATTests

      - name: Stage 4 - IPC & Process Robustness Gate
        run: swift test --filter IPCPeerRobustnessTests

      - name: Stage 5 - Full Integration Test Suite
        run: swift test -v --parallel

      - name: Stage 6 - Smoke Test CLI Executables
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent" --help
          "$BIN_PATH/LingXiCoreHost" auth list
          "$BIN_PATH/lingxiagent" --smoke

  test-linux:
    name: Linux Build & Test (x86_64)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y libsqlite3-dev pkg-config python3 bubblewrap nodejs

      - name: Print Swift Version
        run: swift --version

      - name: Stage 1 - Build All Executable Products
        run: |
          swift build -v --product lingxiagent
          swift build -v --product LingXiCoreHost
          swift build -v --product LingXiTUI

      - name: Stage 2 - Architecture Boundary & Platform Gate
        run: |
          swift test --filter PlatformBoundaryArchitectureTests
          swift test --filter PlatformBuildGateTests

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        run: swift test --filter PlatformCryptoKATTests

      - name: Stage 4 - IPC & Process Robustness Gate
        run: swift test --filter IPCPeerRobustnessTests

      - name: Stage 5 - Full Integration Test Suite
        run: swift test -v --parallel

      - name: Stage 6 - Smoke Test CLI Executables
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent" --help
          "$BIN_PATH/LingXiCoreHost" auth list
          "$BIN_PATH/lingxiagent" --smoke

  test-windows:
    name: Windows Build & Test (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@v0.4.0
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          update-sdk-modules: true

      - name: Provision SQLite Native Dependencies
        shell: cmd
        run: |
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install sqlite3:x64-windows
          call "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" integrate install
          echo INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib;%LIB%>> %GITHUB_ENV%
          echo PATH=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%VCPKG_INSTALLATION_ROOT%;%PATH%>> %GITHUB_ENV%

      - name: Print Swift Version
        run: swift --version

      - name: Stage 1 - Build All Executable Products
        shell: bash
        run: |
          swift build -v --product lingxiagent
          swift build -v --product LingXiCoreHost
          swift build -v --product LingXiTUI

      - name: Stage 2 - Architecture Boundary & Platform Gate
        shell: bash
        run: |
          swift test --filter PlatformBoundaryArchitectureTests
          swift test --filter PlatformBuildGateTests

      - name: Stage 3 - Platform Crypto KAT & Concurrency Gate
        shell: bash
        run: swift test --filter PlatformCryptoKATTests

      - name: Stage 4 - IPC & Process Robustness Gate
        shell: bash
        run: swift test --filter IPCPeerRobustnessTests

      - name: Stage 5 - Full Integration Test Suite
        shell: bash
        run: swift test -v

      - name: Stage 6 - Smoke Test CLI Executables
        shell: bash
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/sqlite3.dll" "$BIN_PATH/" || true
          "$BIN_PATH/lingxiagent.exe" --help
          "$BIN_PATH/LingXiCoreHost.exe" auth list
          "$BIN_PATH/lingxiagent.exe" --smoke
