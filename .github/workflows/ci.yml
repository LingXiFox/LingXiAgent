name: CI Matrix Gate

on:
  push:
    branches: [ main, 'release/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 让 CLI 走非交互分支，避免 smoke test 等 stdin 吊死
  CI: "1"
  LINGXI_NON_INTERACTIVE: "1"

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS：主 gate
  # ─────────────────────────────────────────────────────────────
  test-macos:
    name: macOS Build & Test (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode & print versions
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-

      # 一次编译，产物同时覆盖 executable 与 test bundle
      - name: Build products + tests (single pass)
        timeout-minutes: 25
        run: swift build --build-tests

      # 一次运行，不重新编译；前面所有 --filter stage 已被合并
      - name: Run full test suite
        timeout-minutes: 20
        run: swift test --skip-build --parallel --xunit-output test-results.xml < /dev/null

      - name: Smoke test CLI executables
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent"     --help      < /dev/null
          "$BIN_PATH/LingXiCoreHost"  auth list   < /dev/null
          "$BIN_PATH/lingxiagent"     --smoke     < /dev/null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: test-results.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Linux：主 gate
  # ─────────────────────────────────────────────────────────────
  test-linux:
    name: Linux Build & Test (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swift:6.0.3
      # bubblewrap 在 container 内需要 user namespace，否则沙箱测试会吊死
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsqlite3-dev pkg-config python3 bubblewrap nodejs
          swift --version

      # 沙箱不可用时让测试自己降级跳过，而不是卡在那里等
      - name: Probe bubblewrap availability
        run: |
          if bwrap --dev-bind / / true 2>/dev/null; then
            echo "LINGXI_SANDBOX_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::bubblewrap unavailable in this container; sandbox tests will be skipped"
            echo "LINGXI_SANDBOX_AVAILABLE=0" >> "$GITHUB_ENV"
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-

      - name: Build products + tests (single pass)
        timeout-minutes: 25
        run: swift build --build-tests

      - name: Run full test suite
        timeout-minutes: 20
        run: swift test --skip-build --parallel --xunit-output test-results.xml < /dev/null

      - name: Smoke test CLI executables
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent"     --help      < /dev/null
          "$BIN_PATH/LingXiCoreHost"  auth list   < /dev/null
          "$BIN_PATH/lingxiagent"     --smoke     < /dev/null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Windows：暂设为非阻塞，稳定后删掉 continue-on-error
  # ─────────────────────────────────────────────────────────────
  test-windows:
    name: Windows Build & Test (x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true      # ← Windows 稳定后删除此行
    steps:
      # 注意：不要再叠加 ilammy/msvc-dev-cmd。
      # gha-setup-swift 自己会配好 MSVC 环境，两者叠加会撑爆 cmd.exe 的
      # 8191 字符 PATH 上限，导致整条 PATH 被丢弃。
      - name: Set up Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.0   # v0.4.0 有 PATH 重复 bug
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE

      - uses: actions/checkout@v4

      - name: Diagnose environment
        shell: pwsh
        run: |
          swift --version
          Write-Host "PATH length = $($env:PATH.Length) (cmd.exe limit is 8191)"
          if ($env:PATH.Length -gt 8000) {
            Write-Host "::warning::PATH is近 cmd.exe 上限，可能被截断"
          }
          Get-Command swift, link, cl | Format-Table Name, Source

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-windows-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-windows-

      - name: Build products + tests (single pass)
        shell: bash
        timeout-minutes: 35
        run: swift build --build-tests

      # Windows 的 XCTest 不支持 --parallel
      - name: Run full test suite
        shell: bash
        timeout-minutes: 20
        run: swift test --skip-build < /dev/null

      - name: Smoke test CLI executables
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          "$BIN_PATH/lingxiagent.exe"    --help     < /dev/null
          "$BIN_PATH/LingXiCoreHost.exe" auth list  < /dev/null
          "$BIN_PATH/lingxiagent.exe"    --smoke    < /dev/null

  # ─────────────────────────────────────────────────────────────
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test-macos, test-linux]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.test-linux.result }}" != "success" ]; then
            echo "::error::macOS or Linux gate failed"
            exit 1
          fi
          echo "Gate passed."
